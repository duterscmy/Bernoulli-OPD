name: release-sanity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources without importing the GPU stack
        run: |
          python -m compileall -q \
            setup.py \
            scripts/download_data.py \
            slime/backends/megatron_utils/actor.py \
            slime/backends/megatron_utils/bopd.py \
            slime/backends/megatron_utils/loss.py \
            slime/backends/megatron_utils/model.py \
            slime/backends/megatron_utils/opd.py \
            slime/rollout/bopd.py \
            slime/rollout/on_policy_distillation.py \
            slime/rollout/rm_hub/__init__.py \
            slime/utils/arguments.py \
            tests/test_bopd_baseline.py

      - name: Check shell syntax
        run: |
          bash -n build_conda.sh
          find scripts examples/bopd -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Check release invariants
        run: |
          test -x scripts/download_data.sh
          grep -q 'name="bernoulli-opd"' setup.py
          test "$(cat VERSION)" = "1.0.0"
          grep -q '^version: 1.0.0$' CITATION.cff
          grep -q 'nvidia-cudnn-cu12==9.17.1.4' build_conda.sh
          ! grep -q 'github.com/THUDM/slime.git /root/slime' docker/Dockerfile
